# Nginx untuk Pusat Sekolah. Salin ke /etc/nginx/sites-available/pusat lalu ganti:
#   pusat.sekolah.sch.id → domain/IP server Anda
#   php8.5-fpm.sock      → sesuai versi PHP (Ubuntu 26.04 = 8.5, 24.04 = 8.3); cek: ls /run/php/
server {
    listen 80;
    listen [::]:80;
    server_name pusat.sekolah.sch.id;

    root /var/www/pusat-sekolah/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10M;   # impor CSV

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;   # API memakai HTTP Basic
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
}
